[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-schedule-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pyright>=1.1.414",
    "pytest>=9",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN", "A", "ARG", "B", "UP"]

[tool.pyright]
include = ["."]
exclude = [".venv"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
